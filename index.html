<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TutaMaps — Walk the Better Way</title>

    <!-- Leaflet CSS (map library, free & no API key needed) -->
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />

    <link rel="stylesheet" href="style.css" />
  </head>
  <body>

    <!-- ── Header ─────────────────────────────────────────── -->
    <header class="site-header">
      <div class="logo">
        <span class="logo-icon">🗺️</span>
        <span class="logo-text">TutaMaps</span>
      </div>
      <p class="tagline">Walk the safer, cooler route.</p>
    </header>

    <!-- ── Main layout ────────────────────────────────────── -->
    <main class="layout">

      <!-- Search panel -->
      <section class="search-panel" aria-label="Route search">
        <h2 class="panel-title">Find your route</h2>

        <div class="input-group">
          <label for="start-input">Start</label>
          <input
            id="start-input"
            type="text"
            placeholder="e.g. Central Park, New York"
            autocomplete="off"
          />
        </div>

        <div class="input-group">
          <label for="end-input">End</label>
          <input
            id="end-input"
            type="text"
            placeholder="e.g. Brooklyn Bridge"
            autocomplete="off"
          />
        </div>

        <button id="find-route-btn" class="btn-primary">Find Route</button>
        <button id="clear-btn" class="btn-secondary">Clear</button>

        <!-- Results area (populated by app.js) -->
        <div id="route-info" class="route-info" aria-live="polite"></div>
      </section>

      <!-- Map container -->
      <div id="map" aria-label="Interactive walking map"></div>

    </main>

    <!-- Leaflet JS -->
    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV/XN/WLs="
      crossorigin=""
    ></script>

    <script src="app.js"></script>
  </body>
</html>
